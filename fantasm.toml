# fantasm project configuration. See docs/configuration.md for the schema.

[project]
name = "acorn-adfs"

[rom]
# Default CPU for opcode decoding: "6502" (NMOS) or "65c02" (CMOS).
cpu = "6502"
# ADFS is a BBC sideways ROM mapped at &8000-&BFFF (the lower 8 kB
# at &8000-&9FFF for the 1.30 image).
base_address = 0x8000

[versions]
prefixes = ["adfs"]

# ADFS workspace and the WD1770 floppy registers are declared via
# the driver's external_label() calls; fantasm 0.4.0's lint reads
# them straight from the JSON, so no [memory] block is needed.

[[versions.entry]]
id = "1.30"

